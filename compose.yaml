x-app: &app
  build: .
  environment:
    APP_ENV: ${APP_ENV:-local}
    SESSION_SECURE: ${SESSION_SECURE:-false}
    DB_HOST: db
    DB_PORT: 3306
    DB_NAME: ${DB_NAME:-todo_db}
    DB_USER: ${DB_USER:-todo_app}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-todo_db}
      MYSQL_USER: ${DB_USER:-todo_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *app
    profiles: ["tools"]
    command: ["php", "scripts/migrate.php"]

volumes:
  mysql_data:
